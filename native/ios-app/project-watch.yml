# Opt-in development build. Poki Setup does not provision watchOS bundles.
include: project.yml
name: PokiWithWatch
options:
  deploymentTarget:
    watchOS: "11.0"
targets:
  Poki:
    dependencies:
      - target: PokiWatch
        embed: true
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) POKI_APP POKI_WATCH
  PokiWatch:
    type: application
    platform: watchOS
    sources:
      - path: PokiWatch
        excludes: [Info.plist]
      - path: WatchVoice
    info:
      path: PokiWatch/Info.plist
      properties:
        CFBundleDisplayName: Poki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant]
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(POKI_BUNDLE_ID)
        NSMicrophoneUsageDescription: Poki records your request and sends it to your paired iPhone.
        CFBundleURLTypes:
          - CFBundleURLName: $(POKI_BUNDLE_ID).watchkitapp
            CFBundleURLSchemes: [pokiwatch]
    dependencies:
      - target: PokiWatchFace
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(POKI_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: PokiWatch/Info.plist
  PokiWatchFace:
    type: app-extension
    platform: watchOS
    sources:
      - path: PokiWatchFace
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POKI_BUNDLE_ID).watchkitapp.face
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_FILE: PokiWatchFace/Info.plist
schemes:
  PokiWatch:
    build:
      targets:
        PokiWatch: all
    run:
      config: Debug
