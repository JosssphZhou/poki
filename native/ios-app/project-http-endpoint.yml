# Opt in to one plain-HTTP Custom Endpoint host at build time. Not included by default.
#
#   POKI_HTTP_ENDPOINT_HOST=203.0.113.9 POKI_HTTP_ENDPOINT_OPT_IN=1 xcodegen generate --spec project.yml
#
# ATS stays on for every other host. The exception names exactly one canonical host (lowercase
# ASCII RFC 1123 DNS name without trailing dot, strict dotted-quad IPv4, or canonical unbracketed
# unzoned IPv6). preGenCommand rejects invalid or non-canonical hosts before plists or project
# files are written, and the target pre-build script rechecks Poki/Info.plist before building.
# An IP literal does not cover a DNS name for the same server, and a DNS name does not cover its
# IP (Apple's NSExceptionDomains rules).
options:
  preGenCommand: python3 scripts/validate-http-endpoint-host.py
targets:
  Poki:
    info:
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            "${POKI_HTTP_ENDPOINT_HOST}":
              NSExceptionAllowsInsecureHTTPLoads: true
    preBuildScripts:
      - name: Validate Plain-HTTP Endpoint Host
        script: /usr/bin/env python3 "$SRCROOT/scripts/validate-http-endpoint-host.py" --plist "$SRCROOT/Poki/Info.plist"
        basedOnDependencyAnalysis: false
