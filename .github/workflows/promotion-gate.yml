# The check on a promotion PR (propose-promotion.yml). For a beta: the Gym on the promoted commit,
# passing only when both scorecards finish with zero failures. For a stable: the beta has been
# out for soak_days (.github/channels.json, 3), unless the PR has the soak-override label or the
# proposal gave a reason. Make "promotion gate / verdict" a required check on main.
name: promotion gate

on:
  pull_request:
    branches: [main]
    paths: ['.github/channels.json']
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: promotion-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

permissions:
  contents: read
  actions: read

jobs:
  read:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.r.outputs.channel }}
      sha: ${{ steps.r.outputs.sha }}
      gym_run: ${{ steps.r.outputs.gym_run }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rec="$(python3 .github/scripts/promotion.py pending)"
          echo "$rec"
          channel="$(echo "$rec" | jq -r '.channel // empty')"
          sha="$(echo "$rec" | jq -r '.sha // empty')"
          gym_run=""
          if [ "$channel" = beta ] && { [ "$EVENT_ACTION" = labeled ] || [ "$EVENT_ACTION" = unlabeled ]; }; then
            gym_run="$(python3 .github/scripts/promotion.py gym-run "$HEAD_SHA" "$GITHUB_RUN_ID")"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "gym_run=$gym_run" >> "$GITHUB_OUTPUT"

  gym:
    needs: read
    # Label events skip the Gym only when a completed gate run on this commit already produced
    # scorecards; otherwise the Gym runs so first-time or cancelled-run betas are not blocked.
    if: needs.read.outputs.channel == 'beta' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || needs.read.outputs.gym_run == '')
    uses: ./.github/workflows/ios-gym.yml
    with:
      ref: ${{ needs.read.outputs.sha }}

  verdict:
    needs: [read, gym]
    if: always() && needs.read.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CHANGELOG.md has an entry for this version
        if: needs.read.outputs.channel == 'beta' || needs.read.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/promotion.py changelog
      - name: Stable waits after its beta
        if: needs.read.outputs.channel == 'stable' && !contains(github.event.pull_request.labels.*.name, 'soak-override')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/promotion.py soak
      - name: This build's scorecards
        if: needs.read.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GYM: ${{ needs.gym.result }}
          GYM_RUN: ${{ needs.read.outputs.gym_run }}
        run: |
          set -euo pipefail
          mkdir -p new
          if [ "$GYM" = skipped ]; then
            run="${GYM_RUN:-}"
            if [ -z "$run" ]; then
              run="$(python3 .github/scripts/promotion.py gym-run "$HEAD_SHA" "$GITHUB_RUN_ID")"
            fi
          else
            run="$GITHUB_RUN_ID"
          fi
          [ -n "${run:-}" ] || { echo "::error::no Gym run for $HEAD_SHA yet"; exit 1; }
          for name in gym-scorecard gym-scorecard-inprocess; do
            gh run download "$run" --name "$name" --dir "new/$name" || echo "::warning::$name missing in run $run"
            cp "new/$name/$name.txt" new/ 2>/dev/null || true
          done
      - name: Both Gym scorecards have zero failures
        if: needs.read.outputs.channel == 'beta'
        env:
          GYM: ${{ needs.gym.result }}
        run: |
          set -euo pipefail
          python3 .github/scripts/promotion.py gym new
          if [ "$GYM" != success ] && [ "$GYM" != skipped ]; then
            echo "::error::the Gym workflow did not succeed (result: $GYM)"
            exit 1
          fi
