# Publishes a merged promotion (propose-promotion.yml, promotion-gate.yml): the record in
# .github/channels.json whose tag does not exist yet. A beta's files are its Pre-alpha run's artifact.
# Beta keeps the numeric build in its IPA name:
#   beta    Poki-external-0.3.0-712.ipa on app-0.3.0-beta.1, a prerelease, with the Gym scorecards
#   stable  Poki-external-0.3.0.ipa on app-0.3.0, a full release (never marked Latest: GitHub's
#           Latest is Poki MCP's v* release, which the Mac server's update check reads)
# Poki Setup files come along from app-alpha-latest (beta, filled just before) or the source
# release (stable). Created as a draft, checked, then published. A beta waits for approval in the
# "beta" environment, a stable in "stable" (Settings > Environments > Required reviewers).
#
# Older Poki and Poki Setup still read the Alpha channel's releases and install what they find there.
# So nothing reaches them before that approval: the same job, after it, puts the same build on the
# Alpha releases and then publishes the Beta.
name: Publish promotion

on:
  push:
    branches: [main]
    paths: ['.github/channels.json']
  workflow_dispatch:
    inputs:
      verify_r2:
        description: Verify a signed catalog in an isolated R2 path, then delete it; skip promotion
        type: boolean
        default: false

concurrency:
  group: publish-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read:
    if: inputs.verify_r2 != true
    runs-on: ubuntu-latest
    outputs:
      rec: ${{ steps.r.outputs.rec }}
      channel: ${{ steps.r.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rec="$(python3 .github/scripts/promotion.py pending)"
          echo "$rec"
          echo "rec=$rec" >> "$GITHUB_OUTPUT"
          channel="$(echo "$rec" | jq -r '.channel // empty')"
          case "$channel" in beta|stable|'') ;; *) echo "unknown channel: $channel" >&2; exit 1 ;; esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  verify-r2:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_r2 == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.POKI_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.POKI_R2_SECRET_ACCESS_KEY }}
      POKI_R2_ENDPOINT: ${{ secrets.POKI_R2_ENDPOINT }}
      POKI_R2_BUCKET: poki-releases
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Upload and verify only an isolated signed catalog
        env:
          POKI_RELEASE_SIGNING_KEY: ${{ secrets.POKI_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          node scripts/release/publish-r2.mjs --verify-upload --output evidence | tee evidence/verification.log
      - name: Ensure the test object is removed
        if: always()
        run: node scripts/release/publish-r2.mjs --cleanup-verification --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-upload-verification
          path: evidence/
          if-no-files-found: ignore

  publish:
    needs: read
    if: needs.read.outputs.channel == 'beta' || needs.read.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment: ${{ needs.read.outputs.channel == 'stable' && 'stable' || 'beta' }}
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ fromJSON(needs.read.outputs.rec).channel }}
      LABEL: ${{ fromJSON(needs.read.outputs.rec).version }}
      TAG: ${{ fromJSON(needs.read.outputs.rec).tag }}
      SOURCE: ${{ fromJSON(needs.read.outputs.rec).source }}
      SHA: ${{ fromJSON(needs.read.outputs.rec).sha }}
      BASE: ${{ fromJSON(needs.read.outputs.rec).base_version }}
      BUILD: ${{ fromJSON(needs.read.outputs.rec).build }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ fromJSON(needs.read.outputs.rec).sha }}", fetch-depth: 0, filter: 'tree:0' }
      # The publishing script from this workflow's commit, so older pre-alphas can be published too.
      - uses: actions/checkout@v4
        if: env.CHANNEL == 'beta'
        with: { path: pipeline, sparse-checkout: .github/scripts }
      # A beta's files: the artifact of the Pre-alpha run that built it, downloaded once for the
      # Alpha records and the Beta.
      - name: The Pre-alpha run's build
        if: env.CHANNEL == 'beta'
        run: |
          set -euo pipefail
          run="$(gh run list --workflow prealpha.yml --commit "$SHA" --status success --json databaseId --jq '.[0].databaseId')"
          [ -n "$run" ] || { echo "::error::no successful Pre-alpha run built $SHA (artifacts are kept 90 days)"; exit 1; }
          echo "IPA source: Pre-alpha run $run ($SOURCE, $SHA)"
          gh run download "$run" --name Poki-unsigned --dir prealpha
      # Only after the beta approval above: the build as app-<VERSION>-alpha.<build> on
      # app-alpha-latest (and the old ios-alpha-latest), for older clients, then the Beta below.
      # scripts/release/publish-compat.sh needs that tag and release for the Beta's compatibility
      # release. The tag push uses the workflow's own token, so it starts no tag-triggered workflow,
      # and re-running with the same build is harmless.
      - name: Alpha records for older clients
        if: env.CHANNEL == 'beta'
        run: pipeline/.github/scripts/publish-rolling.sh alpha "$BASE" "$BUILD" prealpha app-prealpha-latest
      - name: The promoted build's files
        run: |
          set -euo pipefail
          # publish-rolling.sh left the Alpha's files in dist/; the Beta's are gathered afresh.
          rm -rf src dist && mkdir -p src dist
          if [ "$CHANNEL" = beta ]; then
            cp prealpha/Poki-external-unsigned.ipa "dist/Poki-external-$BASE-$BUILD.ipa"
            cp prealpha/Poki-signing.zip dist/
            gh release download app-alpha-latest --dir dist --pattern 'PokiSetup-*' --pattern 'SHA256SUMS-desktop.txt' || echo "::warning::no Poki Setup files on app-alpha-latest"
            # The Gym scorecards from the merged PR's gate, the baseline for the next beta.
            pr_head="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha')"
            gate="$(gh run list --workflow promotion-gate.yml --commit "$pr_head" --json databaseId --jq '.[].databaseId' | while read -r id; do
              names="$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts" --jq '.artifacts[].name')" || exit 1
              if grep -qx gym-scorecard <<< "$names"; then echo "$id"; break; fi
            done)"
            if [ -n "$gate" ]; then
              for name in gym-scorecard gym-scorecard-inprocess; do
                gh run download "$gate" --name "$name" --dir "src/$name" && cp "src/$name/$name.txt" dist/ || echo "::warning::$name not found"
              done
            else
              echo "::warning::No Gym scorecard artifact is available for promotion head $pr_head"
            fi
          else
            gh release download "$SOURCE" --dir src
            cp src/Poki-external-*.ipa "dist/Poki-external-$LABEL.ipa"
            cp src/Poki-signing.zip dist/
            cp src/PokiSetup-* src/SHA256SUMS-desktop.txt dist/ 2>/dev/null || true
          fi
          cp deploy/cf-relay/worker.js dist/poki-relay-worker.js
          (cd dist && sha256sum Poki-external-*.ipa poki-relay-worker.js > SHA256SUMS && cat SHA256SUMS)
          ls -la dist
      - name: Notes
        run: |
          set -euo pipefail
          prev="$(git tag --list 'app-[0-9]*' 'ios-v*' --sort=-creatordate | grep -Ev -- '-(pre)?alpha\.' | grep -vx "$TAG" | head -1 || true)"
          {
            if [ "$CHANNEL" = beta ]; then
              n="${LABEL##*beta.}"
              echo "Beta $n of Poki $BASE, for the Beta channel in Poki Setup. It is build $BUILD (\`$SOURCE\`), unchanged, after the Poki Gym."
            else
              echo "Poki $BASE. It is \`$SOURCE\`, unchanged, after its time on the Beta channel."
            fi
            echo
            echo "Install Poki-external with Poki Setup, or sign it with your own tool (entitlements in Poki-signing.zip). See native/ios-app/README.md."
            echo
            if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" HEAD 2>/dev/null; then
              echo "### Changes since $prev"
              git log --no-merges --max-count=80 --format='- %s (%h)' "$prev..HEAD"
            fi
          } > notes.md
          cat notes.md
      - name: Publish
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = beta ]; then
            title="Poki v$BASE Beta ${LABEL##*beta.}"; kind=(--prerelease --latest=false)
          else
            title="Poki v$BASE"; kind=(--latest=false)
          fi
          gh release create "$TAG" dist/* --target "$SHA" --draft --title "$title" --notes-file notes.md "${kind[@]}"
          have="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          [ "$have" -eq "$(ls dist | wc -l)" ] || { echo "::error::the draft has $have files, expected $(ls dist | wc -l); left as a draft"; exit 1; }
          gh release edit "$TAG" --draft=false "${kind[@]}"
          echo "Published $title: https://github.com/$GH_REPO/releases/tag/$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release branch on a version's first beta
        if: env.CHANNEL == 'beta'
        run: |
          branch="release/${BASE%.*}"
          if gh api "repos/$GH_REPO/branches/$branch" >/dev/null 2>&1; then
            echo "$branch exists"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$SHA" >/dev/null && echo "Created $branch at $SHA" || echo "::warning::could not create $branch"
          fi

  mirror-beta:
    needs: [read, publish]
    if: needs.read.outputs.channel == 'beta'
    uses: ./.github/workflows/publish-r2.yml
    with:
      tag: ${{ fromJSON(needs.read.outputs.rec).tag }}
    secrets: inherit
